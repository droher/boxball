x-extract:
  &extract
  build:
    context: extract
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - CHADWICK_VERSION
      - RETROSHEET_VERSION
      - BASEBALLDATABANK_VERSION
      - BUILD_ENV
      - BOXBALL_LOG_LEVEL
  image: ${REPO}:extract-${VERSION}
x-ddl:
  &ddl
  build:
    context: transform
    dockerfile: ddl.Dockerfile
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
      - BOXBALL_LOG_LEVEL
  image: ${REPO}:ddl-${VERSION}
x-parquet:
  &parquet
  build:
    context: transform
    dockerfile: parquet.Dockerfile
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
      - BOXBALL_LOG_LEVEL
  image: ${REPO}:parquet-${VERSION}
  depends_on:
    - extract
x-csv:
  &csv
  build:
    context: transform
    dockerfile: csv.Dockerfile
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
  image: ${REPO}:csv-${VERSION}
  depends_on:
    - extract

x-clickhouse:
  &clickhouse
  build:
    context: load/clickhouse
    dockerfile: ../Dockerfile
    target: clickhouse
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
  image: ${REPO}:clickhouse-${VERSION}
  volumes:
    - ~/boxball/clickhouse:/var/lib/clickhouse
  depends_on:
    - parquet
    - ddl

x-postgres:
  &postgres
  build:
    context: load/postgres
    dockerfile: ../Dockerfile
    target: postgres
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
  image: ${REPO}:postgres-${VERSION}
  volumes:
    - ~/boxball/postgres:/var/lib/postgresql/data
  depends_on:
    - csv
    - ddl

x-postgres-columnar:
  &postgres-columnar
  build:
    context: load/postgres-columnar
    dockerfile: ../Dockerfile
    target: postgres-columnar
    # amd64-only: Citus packagecloud does not ship arm64 .debs (the install
    # script aborts with "the Citus repository does not contain packages for
    # non-x86_64 architectures"). Other targets are multi-arch.
    platforms:
      - "linux/amd64"
    args:
      - VERSION
  image: ${REPO}:postgres-columnar-${VERSION}
  volumes:
    - ~/boxball/postgres-columnar:/var/lib/postgresql/data
  depends_on:
    - csv
    - ddl

x-mysql:
  &mysql
  build:
    context: load/mysql
    dockerfile: ../Dockerfile
    target: mysql
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
  image: ${REPO}:mysql-${VERSION}
  volumes:
    - ~/boxball/mysql:/var/lib/mysql
  depends_on:
    - csv
    - ddl

x-sqlite:
  &sqlite
  build:
    context: load
    target: sqlite
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    args:
      - VERSION
  image: ${REPO}:sqlite-${VERSION}
  volumes:
    - ~/boxball/sqlite:/db
  depends_on:
    - csv
    - ddl


services:
  extract:
    << : *extract
  extract-latest:
    << : *extract
    image: ${REPO}:extract-latest

  ddl:
    << : *ddl
  ddl-latest:
    << : *ddl
    image: ${REPO}:ddl-latest

  parquet:
    << : *parquet
  parquet-latest:
    << : *parquet
    image: ${REPO}:parquet-latest

  csv:
    << : *csv
  csv-latest:
    << : *csv
    image: ${REPO}:csv-latest

  clickhouse:
    << : *clickhouse
  clickhouse-latest:
    << : *clickhouse
    image: ${REPO}:clickhouse-latest

  postgres:
    << : *postgres
  postgres-latest:
    << : *postgres
    image: ${REPO}:postgres-latest

  postgres-columnar:
    << : *postgres-columnar
  postgres-columnar-latest:
    << : *postgres-columnar
    image: ${REPO}:postgres-columnar-latest

  mysql:
    << : *mysql
  mysql-latest:
    << : *mysql
    image: ${REPO}:mysql-latest

  sqlite:
    << : *sqlite
  sqlite-latest:
    << : *sqlite
    image: ${REPO}:sqlite-latest
