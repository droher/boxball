name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.6.9
      - name: ruff check
        # E741,E731 mirror prior flake8 ignores. E714 is a ruff-vs-flake8 divergence
        # (ruff flags `not (x is y)` patterns that flake8/pycodestyle missed); excluded
        # for parity with the prior style job. Revisit in PLE-377 (ruff config promotion).
        run: |
          ruff check . \
            --select=E,F,W \
            --ignore=E741,E731,E714 \
            --line-length=120 \
            --exclude=.git,__pycache__,extract/fixtures,load,venv,tests

  int-test:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --cov

  e2e-test:
    runs-on: ubuntu-latest
    needs: int-test
    env:
      BUILD_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose build
        run: docker compose build
