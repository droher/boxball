name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .

  type-check:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      # Non-blocking: PLE-377 records the basedpyright baseline; strict-mode
      # bring-up is follow-up scope, so type errors don't fail the job.
      # continue-on-error preserves the real exit code in logs (vs `|| true`
      # which would mask uv-itself failures like a missing basedpyright binary).
      - name: basedpyright (advisory)
        continue-on-error: true
        run: uv run basedpyright

  int-test:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest --cov

  e2e-test:
    runs-on: ubuntu-latest
    needs: int-test
    env:
      BUILD_ENV: test
    steps:
      - uses: actions/checkout@v4
      # QEMU registers binfmt_misc handlers for cross-arch emulation. Required
      # so the docker-container buildx driver can build linux/arm64 stages on
      # GitHub's amd64 runners.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # setup-buildx-action provisions a docker-container builder. We pin the
      # builder by id (output) and select it explicitly via BUILDX_BUILDER on
      # the build step rather than relying on the action's `use: true` default
      # — that selection path is not honoured by `docker compose build` in
      # compose v2 (and the action's own `install:` deprecation message points
      # toward env-var selection). Local `make compose-build` uses the same
      # mechanism for parity.
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - name: docker compose build
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker compose build
