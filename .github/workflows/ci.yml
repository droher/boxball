name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .

  type-check:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      # Non-blocking: PLE-377 records the basedpyright baseline; strict-mode
      # bring-up is follow-up scope, so type errors don't fail the job.
      # continue-on-error preserves the real exit code in logs (vs `|| true`
      # which would mask uv-itself failures like a missing basedpyright binary).
      - name: basedpyright (advisory)
        continue-on-error: true
        run: uv run basedpyright

  int-test:
    runs-on: ubuntu-latest
    needs: style
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest --cov

  e2e-test:
    runs-on: ubuntu-latest
    needs: int-test
    env:
      BUILD_ENV: test
    steps:
      - uses: actions/checkout@v4
      # Single-platform host-arch build via the default docker driver. The
      # default driver loads each built image into the local docker image
      # store, so downstream stages' `FROM doublewick/boxball:<stage>-${VERSION}`
      # resolves locally instead of pulling the previous release's tag from
      # the registry. `make build-local` serializes the extract → transform →
      # load wave boundaries; a single `docker compose build` would race
      # since compose v2 builds services in parallel and downstream `FROM`
      # lookups beat the upstream tag landing in the local store.
      # Multi-arch validation requires `--push` (buildx cannot `--load` a
      # manifest list) and lives in the release workflow via
      # `docker buildx bake --push multiarch` against docker-bake.hcl.
      - name: build full chain
        run: make build-local
      # Boot each load-target container against the locally-built images,
      # wait for the database to come up, run a known query against the
      # loaded data, tear it down. A non-zero exit here fails the job: the
      # release workflow gates on this same script so a CI failure means the
      # tagged build is not publishable.
      - name: runtime validate (load targets)
        run: bash scripts/validate-targets.sh
